# oj-verify (online-judge-verify-helper) の設定。
# このディレクトリ (verify/) をカレントディレクトリにして `oj-verify run` を実行する前提で、
# ACL と ei1333-library の include パスを相対パスで指定している。
# リポジトリ直下の Makefile の `make verify` はその cd を行う。

[[languages.cpp.environments]]
CXX = "g++"
CXXFLAGS = [
  "-std=gnu++20",
  "-O2",
  "-Wall",
  "-Wno-sign-compare",
  "-I", "../ac-library",
  "-I", "../ei1333-library",
]
